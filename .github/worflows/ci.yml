name: Qualité du code
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop
jobs:
  quality:
      runs-on: ubuntu-latest
      steps:
        - name: Récupérer le dépôt
          uses: actions/checkout@v7
        - name: Mise en cache
          uses: actions/cache@v6
          with:
            path: ${{ steps.composer-cache.outputs.dir }}
            key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
            restore-keys: ${{ runner.os }}-composer-
        - name: Installation de nodeJS
          uses: actions/setup-node@v3
          with:
            node-version: '20'
  test:
      runs-on: ubuntu-latest
      needs: [quality]
      steps:
        - name: Récupérer le dépôt
          uses: actions/checkout@v7
        - name: Mise en cache
          uses: actions/cache@v6
          with:
            path: ${{ steps.composer-cache.outputs.dir }}
            key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
            restore-keys: ${{ runner.os }}-composer-
        - name: Installation de nodeJS
          uses: actions/setup-node@v3
          with:
            node-version: '20'
        - name: Installer les dépendances
          run: npm ci
        - name: Make dev
          run: npm run dev
        - name: Make test
          run: npm test
        - name: make test-coverage
          run: npm run test:coverage
        - name: make lint
          run: npm run lint
        - name: make build
          run: npm run build
        - name: make docker-build
          run: docker compose build
        - name: make up
          run: docker compose up -d --build
        - name: make logs
          run: docker compose logs -f
        - name: make down
          run: docker compose down
        - name: make clean
          run: rm -rf node_modules dist coverage
  build:
      runs-on: ubuntu-latest
      needs: [test]
      steps:
        - name: Récupérer le dépôt
          uses: actions/checkout@v7
        - name: Mise en cache
          uses: actions/cache@v6
          with:
            path: ${{ steps.composer-cache.outputs.dir }}
            key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
            restore-keys: ${{ runner.os }}-composer-